name: CI

# 앱은 저장소의 Interior-Simulator/ 아래에 있다. 계획 문서만 바뀐 커밋에서는 돌지 않는다.
# main에서는 검사가 모두 통과한 뒤에만 GitHub Pages에 배포한다(맨 아래 deploy job).
on:
  push:
    branches: [main]
    paths:
      - "Interior-Simulator/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "Interior-Simulator/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# PR에 새 커밋이 오면 이전 실행을 취소한다. main은 실행 중인 것을 끊지 않고 한 번에 하나씩
# 돌아, 배포 순서가 커밋 순서와 같다. 대기 중인 실행은 더 새 커밋이 오면 그것으로 바뀐다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: Interior-Simulator

jobs:
  check:
    name: Lint · 단위 테스트 · 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Interior-Simulator/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  e2e:
    name: E2E (Playwright · Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Interior-Simulator/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # playwright.config.ts가 production 빌드를 띄워 실행한다. CI에서는 실패한 테스트를
      # 한 번 다시 돌리고, 재시도로 통과한 테스트는 보고서에 flaky로 남는다.
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            Interior-Simulator/playwright-report/
            Interior-Simulator/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # lint·단위 테스트·빌드와 E2E가 모두 통과해야 배포한다. PR과 다른 브랜치에서는 건너뛴다.
  # 다시 배포할 때는 Actions에서 main을 골라 이 워크플로를 수동 실행한다(검사부터 다시 돈다).
  deploy:
    name: 배포
    needs: [check, e2e]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
