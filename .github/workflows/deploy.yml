name: Deploy to GitHub Pages

# 빌드해서 GitHub Pages에 올린다. 주소: https://jhpark-coder.github.io/Interior-Simulator/
# 혼자 돌지 않고 ci.yml의 deploy job이 검사가 모두 통과한 뒤에 부른다.
# 권한(pages: write, id-token: write)은 부르는 job이 준다.
on:
  workflow_call:

defaults:
  run:
    working-directory: Interior-Simulator

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Interior-Simulator/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          VITE_BASE: /Interior-Simulator/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Interior-Simulator/dist

  deploy:
    name: Pages에 올리기
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    # 배포는 한 번에 하나만. 진행 중인 배포는 끊지 않는다.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
